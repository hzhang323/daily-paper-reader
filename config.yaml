  intent_profiles:
    - tag: time-series
      description: 查询时间序列相关的学术论文，涵盖预测、异常检测、基础模型与基准等。
      enabled: true
      paper_sources:
        - arxiv
        - biorxiv
      keywords:
        - keyword: time series forecasting
          keyword_cn: 时间序列预测
          query: methods and models for predicting future values in time series data
        - keyword: time series anomaly detection
          keyword_cn: 时间序列异常检测
          query: detecting unusual patterns or outliers in temporal sequences
        - keyword: time series foundation model
          keyword_cn: 时间序列基础模型
          query: large pre-trained models for general time series analysis
        - keyword: large language model time series
          keyword_cn: 大规模语言模型用于时间序列
          query: applying large language models to time series tasks
        - keyword: time series agents
          keyword_cn: 时间序列智能体
          query: autonomous agents that interact with time series data
        - keyword: time series benchmark
          keyword_cn: 时间序列基准
          query: standardized datasets and evaluation suites for time series models
      intent_queries:
        - query: foundation models for time series and large language model time series analysis
          query_cn: 时序基础模型与大规模语言模型时序分析
          enabled: true
          source: manual
          note: ''
        - query: time series benchmarks and autonomous agents
          query_cn: 时序基准与自主智能体
